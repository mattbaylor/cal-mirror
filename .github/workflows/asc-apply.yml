# Push this repo's listing metadata and screenshots into App Store Connect, and
# optionally submit for review.
#
# Defaults to a plan: with `apply` unticked it writes nothing and prints exactly
# what it would change. Tick `apply` to write, and `submit` only when the plan
# has already been read and agreed with.
name: App Store Connect apply

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to bring in line
        type: string
        default: "2.0"
      build:
        description: Build number to attach
        type: string
        default: "12"
      apply:
        description: Actually write (unticked = plan only)
        type: boolean
        default: false
      submit:
        description: Submit for review as well (needs apply)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: asc-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet cryptography
      - env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          CM_VERSION: ${{ inputs.version }}
          CM_BUILD: ${{ inputs.build }}
          # The sandbox tester, into the review details' demo-account fields.
          # Repository secrets; never in the notes, never in the repo.
          CM_DEMO_USER: ${{ secrets.ASC_DEMO_USER }}
          CM_DEMO_PASS: ${{ secrets.ASC_DEMO_PASS }}
          CM_APPLY: ${{ inputs.apply && '1' || '0' }}
          CM_SUBMIT: ${{ inputs.submit && '1' || '0' }}
        run: python3 appstore/tools/asc_apply.py
