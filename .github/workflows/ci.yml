# Compile everything that ships, on every PR.
#
# cmk-check covers the pure engine logic, but for a long time it was the ONLY
# job here — nothing compiled standalone/menu.swift or either App Store target, so a
# syntax error in the menu-bar app could reach a release build untouched by CI. The
# build jobs below close that: they do not run the apps, they just prove all
# three products still compile.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cmk-check:
    name: cmk-check
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Run CalMirrorKit pure-logic self-check
        working-directory: apple
        run: swift run cmk-check
      # The request-page copy is written once in Copy.json and generated into
      # both the app's strings and the contact sheet Matt reviews. If those
      # could drift, the sheet would show words the app does not ship — which
      # is worse than having no sheet, because it gets reviewed as if it were
      # true. Same guard the web app puts on its generated dump type.
      - name: Request-page copy is in sync with its source
        working-directory: apple
        run: |
          python3 tools/gen-request-copy.py
          python3 tools/gen-review.py
          git diff --exit-code -- Shared/RequestPage/Copy.swift tools/contact-sheet.html tools/review.html

  build-standalone:
    # The engine and the menu-bar UI: plain swiftc, ad-hoc signed. No project
    # generation and no package resolution, so this is the fast signal.
    name: build standalone apps
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift version
        run: swiftc --version
      - name: Build engine (cal-mirror.app)
        working-directory: standalone
        run: ./build.sh
      - name: Build menu-bar UI (CalMirrorMenu.app)
        working-directory: standalone
        run: ./build-ui.sh

  build-app-store:
    # The sandboxed macOS app and the iOS app. Built on the same runner family
    # as release.yml, so a green check here means the release build should also
    # compile. Signing is off: this checks compilation, not distribution.
    name: build App Store targets
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate Xcode projects
        run: |
          set -euo pipefail
          (cd apple/mac && xcodegen generate)
          (cd apple/ios && xcodegen generate)
      - name: Build CalMirrorMac (macOS)
        working-directory: apple/mac
        run: |
          xcodebuild -project CalMirrorMac.xcodeproj -scheme CalMirrorMac \
            -configuration Debug -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO -quiet build
      - name: Build CalMirror (iOS)
        working-directory: apple/ios
        run: |
          xcodebuild -project CalMirror.xcodeproj -scheme CalMirror \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO -quiet build

  claims:
    # The listing and the site are held to the same accuracy rules: what the
    # App Store build can do on each platform, the glossary, and the 2.0
    # network claim with its qualifier. genmeta.py regenerates the metadata
    # and fails on a banned phrase or an overlong field; checksite.py scans
    # every page under site/. notes/REVIEW.md D5 is why the second exists.
    name: listing and site claims
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The listing is what genmeta.py generates, and within Apple's limits
        working-directory: appstore/tools
        run: |
          python3 genmeta.py
          git diff --exit-code -- ../metadata
      - name: The site makes no claim the listing may not
        run: python3 appstore/tools/checksite.py
      # The site ships in every language it offers, or not at all. Without this
      # a new page lands in English, the German nav grows an "(EN)" label, and
      # the switcher starts handing readers pages they cannot read. The check
      # reads the language list out of nav.js, so adding a language adds its
      # requirement automatically.
      - name: Every page exists in every language
        run: python3 site/i18n-check.py

  askwhen-web:
    # The request page. Linux, because nothing here is Apple — and because the
    # timezone tests want a full-ICU Node, which the setup-node runners have.
    #
    # The no-network step is the one that matters. It greps the built bundle for
    # every way a page can reach off-origin, so the privacy claim is checked
    # against the artifact that ships rather than against the intent behind it.
    name: askwhen web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 24: the tests are TypeScript and run under Node's own type
          # stripping, which is unflagged from 22.18 and settled by 24.
          node-version: '24'
          cache: npm
          cache-dependency-path: askwhen/web/package-lock.json
      - name: Install
        working-directory: askwhen/web
        run: npm ci
      - name: Types from the schema, then tsc
        working-directory: askwhen/web
        run: npm run typecheck
      - name: The generated types are the committed ones
        # gen-types.mjs writes src/generated/ from the schema. If the schema
        # changed and the commit did not carry the regenerated file, the
        # editor and the build would disagree about the dump's shape.
        working-directory: askwhen/web
        run: git diff --exit-code -- src/generated/
      - name: Timezone and DST tests
        working-directory: askwhen/web
        run: npm test
      - name: Build
        working-directory: askwhen/web
        run: node build.mjs
      - name: Prove the page reaches nothing off-origin
        working-directory: askwhen/web
        run: node test/no-network.mjs

  askwhen-service:
    # The Go service. Only the TLS authorization gate exists so far, and it is
    # the piece most worth a CI job: it runs on caddy-dc, the proxy that already
    # fronts unrelated customer sites, and a mistake there costs that proxy its
    # ability to issue any certificate at all.
    #
    # The store tests read infra/schema.sql directly rather than a copy, so this
    # job also proves the schema still applies and that its foreign keys cascade.
    name: askwhen service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: askwhen/service/go.sum
      - name: Vet
        working-directory: askwhen/service
        run: go vet ./...
      - name: Check formatting
        working-directory: askwhen/service
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt would change:"; echo "$unformatted"; exit 1
          fi
      - name: Test
        working-directory: askwhen/service
        run: go test -race ./...
