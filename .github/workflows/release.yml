# Build and upload the App Store artifacts from a RELEASE macOS runner.
#
# WHY THIS EXISTS
# ---------------
# App Store submissions must be produced by release software. Every build
# records the OS that made it in BuildMachineOSBuild, and a machine running a
# beta macOS stamps a seed build id (e.g. 26A5416b) into the binary. Builds
# made on a beta OS were rejected by App Review on both platforms even though
# they were correctly signed and passed `altool --validate-app`.
#
# GitHub's macOS runners run release macOS, so building here keeps the
# provenance clean regardless of what the maintainer's laptop is running.
# The "Verify release toolchain" step below fails the run if that ever stops
# being true, rather than shipping another rejected build.

name: Release to App Store Connect

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Which targets to build
        type: choice
        options: [both, ios, mac]
        default: both
      upload:
        description: Upload to App Store Connect (unchecked = build + validate only)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest RELEASE Xcode
        run: |
          set -euo pipefail
          best=""; bestver=""
          for app in /Applications/Xcode*.app; do
            [ -d "$app" ] || continue
            ver="$(defaults read "$app/Contents/Info.plist" CFBundleShortVersionString 2>/dev/null || echo)"
            build="$("$app/Contents/Developer/usr/bin/xcodebuild" -version 2>/dev/null | sed -n 2p || echo)"
            case "$ver" in *[Bb]eta*) continue;; esac
            case "$app" in *beta*) continue;; esac
            [ -n "$ver" ] || continue
            if [ -z "$bestver" ] || [ "$(printf '%s\n%s\n' "$bestver" "$ver" | sort -V | tail -1)" = "$ver" ]; then
              best="$app"; bestver="$ver"
            fi
          done
          [ -n "$best" ] || { echo "::error::no release Xcode found on this runner"; exit 1; }
          echo "Using $best ($bestver)"
          echo "CM_XCODEBUILD=$best/Contents/Developer/usr/bin/xcodebuild" >> "$GITHUB_ENV"
          sudo xcode-select -s "$best/Contents/Developer"

      - name: Verify release toolchain and OS
        run: |
          set -euo pipefail
          sw_vers
          OSBUILD="$(sw_vers -buildVersion)"
          # Seed builds look like 26A5416b: 2+ digits after the letter AND a
          # trailing lowercase letter. Release builds (26A123) have neither.
          if printf '%s' "$OSBUILD" | grep -Eq '^[0-9]+[A-Z][0-9]{4,}[a-z]$'; then
            echo "::error::runner is on a BETA macOS ($OSBUILD); builds would be rejected"
            exit 1
          fi
          echo "runner macOS build $OSBUILD looks like a release build"
          "$CM_XCODEBUILD" -version

      - name: Install signing assets
        env:
          DIST_CERT_P12: ${{ secrets.APPLE_DIST_CERT_P12 }}
          DIST_CERT_PASSWORD: ${{ secrets.APPLE_DIST_CERT_PASSWORD }}
          INSTALLER_CERT_P12: ${{ secrets.APPLE_INSTALLER_CERT_P12 }}
          INSTALLER_CERT_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERT_PASSWORD }}
          IOS_PROFILE: ${{ secrets.APPLE_IOS_PROFILE }}
          MAC_PROFILE: ${{ secrets.APPLE_MAC_PROFILE }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KPASS="$(uuidgen)"
          security create-keychain -p "$KPASS" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KPASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          echo "$DIST_CERT_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$DIST_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KPASS" "$KEYCHAIN" >/dev/null
          rm -f "$RUNNER_TEMP/dist.p12"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep "Apple Distribution" || {
            echo "::error::Apple Distribution identity not present after import"; exit 1; }

          # The Mac App Store .pkg is signed by a SEPARATE installer certificate
          # ("3rd Party Mac Developer Installer"). Without it the macOS export
          # fails with: No signing certificate "Mac Installer Distribution" found.
          # Installer certs are not codesigning identities, so they do not show
          # up under -p codesigning — check for the certificate itself.
          echo "$INSTALLER_CERT_P12" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          security import "$RUNNER_TEMP/installer.p12" -k "$KEYCHAIN" -P "$INSTALLER_CERT_PASSWORD" \
            -T /usr/bin/productbuild -T /usr/bin/productsign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: -s -k "$KPASS" "$KEYCHAIN" >/dev/null
          rm -f "$RUNNER_TEMP/installer.p12"
          security find-certificate -c "3rd Party Mac Developer Installer" "$KEYCHAIN" >/dev/null 2>&1 || {
            echo "::error::Mac Installer Distribution certificate not present after import"; exit 1; }

          # Xcode 16+ reads profiles from UserData; write both known locations.
          for d in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" \
                   "$HOME/Library/MobileDevice/Provisioning Profiles"; do
            mkdir -p "$d"
            echo "$IOS_PROFILE" | base64 --decode > "$d/cal-mirror-ios.mobileprovision"
            echo "$MAC_PROFILE" | base64 --decode > "$d/cal-mirror-mac.provisionprofile"
          done

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Install App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_KEY_P8" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Build, validate and (optionally) upload
        env:
          CM_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          CM_ASC_ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          args=(--validate)
          case "${{ inputs.platforms }}" in
            ios) args+=(--ios);;
            mac) args+=(--mac);;
          esac
          if [ "${{ inputs.upload }}" = "true" ]; then args+=(--upload); fi
          ./release-appstore.sh "${args[@]}"

      - name: Show build provenance
        if: always()
        run: |
          set -euo pipefail
          for a in dist/*.xcarchive; do
            [ -d "$a" ] || continue
            app="$(find "$a/Products" -maxdepth 3 -name '*.app' | head -1)" || true
            [ -n "$app" ] || continue
            # iOS keeps Info.plist at the bundle root, macOS under Contents/.
            # plutil writes its "no such file" complaint to stdout, so chaining
            # with || captured the error text as the value instead of falling
            # through. Pick the path first, then read it once.
            plist="$app/Info.plist"
            [ -f "$plist" ] || plist="$app/Contents/Info.plist"
            echo "$(basename "$a"): BuildMachineOSBuild=$(plutil -extract BuildMachineOSBuild raw "$plist" 2>/dev/null || echo '?')"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appstore-artifacts
          path: |
            dist/ios-export/*.ipa
            dist/mac-export/*.pkg
          if-no-files-found: warn
