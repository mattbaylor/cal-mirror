# Watch App Store Connect for whichever version is in review, then stamp the site.
#
# The site's release notes mark a version "In review" until Apple approves it.
# Nothing else knows when that happens, and a stale "In review" on a shipped
# version is exactly the sort of thing that sits there for months.
#
# Runs quietly: if the page carries no "In review" pill, or the version is not
# live on every platform yet, the job prints its finding and exits 0. Once the
# pill is gone it is permanently a no-op, so there is nothing to turn off.
#
# HOW IT LANDS THE CHANGE
#   With a CM_RELEASE_TOKEN secret (a PAT owned by the repo admin) it commits
#   straight to main, and the Pages workflow publishes.
#   Without one it opens a PR instead — GITHUB_TOKEN cannot push to a protected
#   branch, and PRs it opens do not trigger the required cmk-check, so that PR
#   needs a human merge.

name: Watch App Store review

on:
  schedule:
    - cron: "23 */3 * * *"   # every 3 hours, off the hour on purpose
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: watch-review
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.CM_RELEASE_TOKEN || github.token }}

      - run: pip install --quiet cryptography

      # The secrets context is not available in step-level `if:`, so resolve
      # whether we have a push token into a plain output first.
      - id: cfg
        env:
          TOKEN: ${{ secrets.CM_RELEASE_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "has_token=true" >> "$GITHUB_OUTPUT";
          else echo "has_token=false" >> "$GITHUB_OUTPUT"; fi

      - id: check
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: python3 .github/scripts/check_review.py

      - name: Commit to main (needs CM_RELEASE_TOKEN)
        if: steps.check.outputs.released == 'true' && steps.cfg.outputs.has_token == 'true'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/changelog.html docs/index.html
          git commit -m "Site: ${{ steps.check.outputs.version }} cleared review on ${{ steps.check.outputs.date }}

          App Store Connect reports ${{ steps.check.outputs.version }} live on every
          platform, so the release notes no longer say In review and the
          build-from-source notes are gone from the home page. Stamped
          automatically by .github/workflows/watch-review.yml."
          git push origin HEAD:main

      - name: Open a PR instead (no token)
        if: steps.check.outputs.released == 'true' && steps.cfg.outputs.has_token == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BR="site/${{ steps.check.outputs.version }}-released"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BR"
          git add docs/changelog.html docs/index.html
          git commit -m "Site: ${{ steps.check.outputs.version }} cleared review on ${{ steps.check.outputs.date }}"
          git push origin "$BR"
          if ! gh pr create --base main --head "$BR" \
              --title "Site: ${{ steps.check.outputs.version }} cleared review" \
              --body "App Store Connect reports ${{ steps.check.outputs.version }} live on every platform, so the release notes should no longer say *In review* and the build-from-source notes should be gone from the home page.

            Opened automatically by \`watch-review.yml\`. Merging publishes the site.

            Note: PRs opened with \`GITHUB_TOKEN\` do not trigger \`cmk-check\`, so this needs a manual merge. Add a \`CM_RELEASE_TOKEN\` secret to have the watcher commit straight to main instead."
          then
            REPO="${{ github.repository }}"
            {
              echo "## ${{ steps.check.outputs.version }} is live, and the site does not say so yet"
              echo
              echo "The branch \`$BR\` is pushed and correct. Creating the pull request"
              echo "was refused, which happens when **Settings -> Actions -> General ->**"
              echo "**Allow GitHub Actions to create and approve pull requests** is off."
              echo
              echo "Open it by hand: https://github.com/$REPO/compare/main...$BR?expand=1"
              echo
              echo "To stop this recurring, either turn that setting on, or add a"
              echo "\`CM_RELEASE_TOKEN\` secret and the watcher commits straight to main."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::${{ steps.check.outputs.version }} is live but the PR could not be created — see the run summary for the one-click link."
            exit 1
          fi
