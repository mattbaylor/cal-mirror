# XcodeGen spec for the iOS/iPadOS app.
#   brew install xcodegen
#   cd apple/ios && xcodegen generate && open CalMirror.xcodeproj
name: CalMirror
options:
  bundleIdPrefix: io.github.mattbaylor
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  CalMirrorKit:
    path: ".."          # apple/ — the Swift package with the shared engine

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad
    # Signing team. Set here so `xcodegen generate` does not blank it out every
    # time — a regenerated project would otherwise archive with no team.
    DEVELOPMENT_TEAM: VAAN252QS8

targets:
  CalMirror:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - CalMirror
      - ../Shared
    dependencies:
      - package: CalMirrorKit
        product: CalMirrorKit
      # Linked explicitly. Without it the build still compiles SyncIntent.swift,
      # but appintentsmetadataprocessor skips extraction ("No AppIntents.framework
      # dependency found") and the Shortcuts action never appears — a silent
      # no-op that looks like a successful build.
      - sdk: AppIntents.framework
    settings:
      base:
        PRODUCT_NAME: CalMirror
        PRODUCT_BUNDLE_IDENTIFIER: io.github.mattbaylor.cal-mirror
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "13"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: CalMirror/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic

# The StoreKit configuration for AskWhen.me, synced from App Store Connect
# (group 22387296; three annual products, the free trial on Request Page
# only). Attached to the run scheme so the purchase flow works against it —
# no network, no sandbox account — which is how the UI is built and
# screenshotted. Regenerate the project after editing this file.
schemes:
  CalMirror:
    build:
      targets:
        CalMirror: all
    run:
      config: Debug
      storeKitConfiguration: ../AskWhen.storekit
    archive:
      config: Release
