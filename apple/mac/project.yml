# XcodeGen spec for the sandboxed macOS (App Store) app.
#   brew install xcodegen
#   cd apple/mac && xcodegen generate && open CalMirrorMac.xcodeproj
name: CalMirrorMac
options:
  bundleIdPrefix: io.github.mattbaylor
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  CalMirrorKit:
    path: ".."          # apple/ — the shared engine package

settings:
  base:
    SWIFT_VERSION: "5.9"
    # Signing team. Set here so `xcodegen generate` does not blank it out every
    # time — a regenerated project would otherwise archive with no team.
    DEVELOPMENT_TEAM: VAAN252QS8

targets:
  CalMirrorMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - CalMirrorMac
      - ../Shared
    dependencies:
      - package: CalMirrorKit
        product: CalMirrorKit
      # Linked explicitly. Without it the build still compiles SyncIntent.swift,
      # but appintentsmetadataprocessor skips extraction ("No AppIntents.framework
      # dependency found") and the Shortcuts action never appears — a silent
      # no-op that looks like a successful build.
      - sdk: AppIntents.framework
    settings:
      base:
        PRODUCT_NAME: cal-mirror
        PRODUCT_BUNDLE_IDENTIFIER: io.github.mattbaylor.cal-mirror
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "12"
        # Empty unless release.yml passes it. The Info.plist entry
        # expands to nothing, and the app then simply cannot reserve
        # a name — every other path is unaffected.
        AW_HOLD_KEY: ""
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: CalMirrorMac/Info.plist
        CODE_SIGN_ENTITLEMENTS: CalMirrorMac/CalMirrorMac.entitlements
        ENABLE_APP_SANDBOX: YES
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

# The StoreKit configuration for AskWhen.me, synced from App Store Connect
# (group 22387296; three annual products, the free trial on Request Page
# only). Attached to the run scheme so the purchase flow works against it —
# no network, no sandbox account — which is how the UI is built and
# screenshotted. Regenerate the project after editing this file.
schemes:
  CalMirrorMac:
    build:
      targets:
        CalMirrorMac: all
    run:
      config: Debug
      storeKitConfiguration: ../AskWhen.storekit
    archive:
      config: Release
