# askwhen.me — the whole deployment.
#
# Runs on CT 112 (172.16.1.41), public at 64.111.27.242 through a pfSense port
# forward. Two containers: the service, and its own Caddy terminating TLS —
# decided 16 September 2026 so that on-demand issuance for customer domains
# never runs on the proxy other people's sites depend on (edge.md). No DNS
# credential lives here: there is no wildcard certificate to need one.
# Mail is not here either: it goes to Postal on dlvr.rehosted.us over its API,
# so the DKIM private key never exists on this machine (mail.md).
#
#   python3 infra/deploy.py --apply
#
# is the whole procedure. Read README.md first — there are DNS records and a
# DKIM key that have to exist before the first confirmation email is sent, and
# no way to un-send the ones that go out before they do.

name: askwhen

services:
  app:
    build:
      # The context is askwhen/, so the image can see web/, service/ and
      # schema/. Keeping the Dockerfile in infra/ keeps every deployable
      # artifact in one reviewable directory.
      context: ..
      dockerfile: infra/Dockerfile
    restart: unless-stopped

    environment:
      AW_LISTEN: ":8080"
      AW_DB: "/data/askwhen.db"

      # Public origin. Used to build confirmation links, which are the single
      # most fragile thing in the product: a link built against the wrong host
      # is a request nobody can confirm.
      AW_ORIGIN: "https://askwhen.me"

      # Mail, through Postal's HTTP API rather than SMTP (Matt, 10 Sept 2026).
      # One HTTPS call from a binary that already has an HTTP client; no SMTP
      # library, no STARTTLS, and the credential is a bearer key rather than a
      # password. Postal owns the return path (psrp.askwhen.me) and sees every
      # bounce itself, so there is no envelope sender to configure here.
      AW_POSTAL_URL: "https://dlvr.rehosted.us"
      AW_POSTAL_API_KEY_FILE: "/run/secrets/postal_api_key"
      AW_MAIL_FROM: "AskWhen.me <no-reply@askwhen.me>"

      # Pepper for the write-token, confirm-token and rate-limit-key hashes
      # (schema.sql). Rotating it invalidates every write token in existence,
      # and there is no account to recover one from. Treat it as permanent.
      AW_PEPPER_FILE: "/run/secrets/pepper"

      # The credential the edge presents when asking whether a hostname may
      # have a certificate issued. Not the pepper: this one is shared with the
      # caddy container's configuration and can be rotated without
      # invalidating every write token in existence.
      AW_TLS_AUTH_SECRET_FILE: "/run/secrets/tls_auth_secret"
      AW_ZONE: "askwhen.me"
      # The proxy whose X-Forwarded-For is believed and whose bare requests
      # may reach /internal/: the caddy container, at the fixed address the
      # `edge` network gives it. A list is accepted (comma or space) for the
      # window when two edges overlap, as on 16 Sept 2026; it should be one
      # address at every other time.
      AW_TRUSTED_PROXY: "172.28.0.2"
      # Where a custom domain is supposed to point (§7): the CNAME target a
      # customer is told, and the edge's public address for an apex that
      # cannot carry a CNAME. Both are checked before the gate will issue.
      AW_EDGE_TARGET: "edge.askwhen.me"
      AW_EDGE_IPS: "64.111.27.242"

      # Apple. Transactions must be for this bundle. AW_APPSTORE_SANDBOX=1
      # lets Sandbox transactions create pages, which is how the purchase
      # flow is proven before launch; set it to "0" at launch, or anyone
      # with a sandbox account for the bundle gets free pages.
      AW_BUNDLE_ID: "io.github.mattbaylor.cal-mirror"
      AW_APPSTORE_SANDBOX: "1"

      # Retention, from architecture §10. Here rather than compiled in, because
      # these are the numbers a regulator or a customer will ask about and they
      # should be readable without a Go toolchain. The 48h ceiling is *also*
      # enforced by a trigger in schema.sql; this value cannot exceed it.
      AW_TTL_UNCONFIRMED: "1h"
      AW_TTL_CONFIRMED: "336h"   # 14 days
      AW_TTL_RESOLVED: "48h"     # ceiling, not target — purged on delivery confirm
      AW_HOLD_INITIAL: "15m"
      AW_HOLD_CONFIRMED: "24h"
      AW_SWEEP_INTERVAL: "60s"

      # Abuse, §8. Double opt-in and the honeypot are not switchable: they are
      # the design. This is the per-IP limit and the deferred proof-of-work
      # seam, which stays off until there is traffic to justify it.
      AW_RATE_PER_IP: "10/1h"
      AW_POW: "off"

    secrets:
      - postal_api_key
      - pepper
      - tls_auth_secret

    volumes:
      - aw-data:/data

    networks:
      edge:
        # Pinned so that it cannot take the caddy container's address first
        # (it starts first: caddy depends on it being healthy).
        ipv4_address: 172.28.0.3

    # No published port. :8080 is reachable from the caddy container over the
    # `edge` network and from nowhere else — not the DC network, not this
    # host's other containers. The gate on /internal/tls-authorize does not
    # rely on that: it refuses without the secret regardless of who asks
    # (tlsauth), and refuses anything carrying an X-Forwarded-* header.

    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    healthcheck:
      # The binary answers its own health check; distroless has no shell and no
      # curl, and adding either to get a health check would undo the reason for
      # choosing it.
      test: ["CMD", "/askwhen", "-healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backup:
    # A nightly `VACUUM INTO` of the database, to its own volume, keeping 14
    # days. PBS snapshots the guest; a WAL-mode SQLite file mid-write is not
    # guaranteed consistent in a snapshot, and this copy is. Same uid as the
    # app, the database opened read-only, no network.
    build:
      context: ..
      dockerfile: infra/Dockerfile.backup
    restart: unless-stopped
    environment:
      AW_DB: "/data/askwhen.db"
      AW_BACKUP_DIR: "/backups"
      AW_BACKUP_KEEP_DAYS: "14"
      AW_BACKUP_AT: "03:10"
    volumes:
      # Read-write mount, read-only open: a WAL reader has to touch the -shm
      # file, and the script opens the database with mode=ro regardless.
      - aw-data:/data
      - aw-backups:/backups
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"

  caddy:
    # Pinned. An unpinned tag on a TLS terminator is how the DC edge spent
    # three years on 2.6.2 without anyone deciding to (infra/edge/upgrade-plan.md).
    # Upgrading is: pull the next tag, validate the Caddyfile against it,
    # change this line, `deploy.py up --apply`.
    image: caddy:2.11.4
    restart: unless-stopped

    # The secret is a file (a compose secret) and the Caddyfile wants it as
    # an environment variable at adapt time, so the command bridges the two.
    # `deploy.py reload` does the same before `caddy reload`, or the reload
    # would adapt the file with an empty key and the gate would refuse
    # everything — fail closed, but broken.
    command:
      - sh
      - -c
      - 'AW_TLS_AUTH_SECRET="$$(cat /run/secrets/tls_auth_secret)" exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile'

    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"

    networks:
      edge:
        # Fixed, because the app trusts X-Forwarded-For from exactly this
        # address (AW_TRUSTED_PROXY above) and admits /internal/ from it alone.
        ipv4_address: 172.28.0.2

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The ACME account key and every issued certificate. Losing it means
      # re-issuing all of them against Let's Encrypt's weekly limits.
      - caddy-data:/data
      - caddy-config:/config

    secrets:
      - tls_auth_secret

    depends_on:
      app:
        condition: service_healthy

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


networks:
  # Its own subnet so the caddy container's address is knowable in advance.
  # Not 172.16.0.0/16, which is the datacenter's internal range.
  edge:
    ipam:
      config:
        - subnet: 172.28.0.0/24


secrets:
  # From Infisical: postal_api_key. A Postal *server* credential of type API,
  # created in the askwhen.me organization's `main` server.
  postal_api_key:
    file: ./secrets/postal_api_key
  pepper:
    file: ./secrets/pepper
  # openssl rand -hex 32 > infra/secrets/tls_auth_secret
  # Shared by the app (as a file) and the caddy container (as an environment
  # variable, via its command). Nothing outside this compose project has it.
  tls_auth_secret:
    file: ./secrets/tls_auth_secret

volumes:
  aw-data:
  # The nightly copies. Under /var/lib/docker/volumes on the guest, which is
  # what PBS carries; the copies are the database's equal in every policy
  # sense and never leave this host.
  aw-backups:
  caddy-data:
  caddy-config:
