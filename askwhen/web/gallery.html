<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>askwhen — contact sheet</title>
    <style>
      :root {
        color-scheme: light dark;
        --page: #e8ecf3;
        --ink: #0d1220;
        --note: #5a6a80;
        --edge: #cfd8e6;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page: #06080d;
          --ink: #e6edf3;
          --note: #8494a8;
          --edge: #1c2432;
        }
      }
      body {
        margin: 0;
        background: var(--page);
        color: var(--ink);
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial,
          sans-serif;
        padding: 32px 24px 64px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 4px;
      }
      .lede {
        color: var(--note);
        margin: 0 0 30px;
        max-width: 70ch;
      }
      #sheet {
        display: grid;
        /* Fixed 390px columns, not 1fr: a contact sheet is only useful if every
           frame is the same true size, and stretching them to fill the window
           makes the phone width a lie. */
        grid-template-columns: repeat(auto-fill, 390px);
        justify-content: start;
        gap: 30px 26px;
        align-items: start;
      }
      .cell h2 {
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.6px;
        margin: 0 0 2px;
      }
      .cell p {
        color: var(--note);
        font-size: 13px;
        margin: 0 0 10px;
        min-height: 2.6em;
      }
      .device {
        width: 390px;
        max-width: 100%;
        height: 760px;
        overflow: auto;
        border: 1px solid var(--edge);
        border-radius: 14px;
        box-shadow: 0 10px 30px rgba(20, 35, 60, 0.12);
      }
    </style>
  </head>
  <body>
    <h1>askwhen request page — every state, at true size</h1>
    <p class="lede">
      390&nbsp;pt frames, the narrow end of a phone. Time is pinned to 1 September 2026, 18:30 UTC so
      the sheet does not change under you. Switch your system appearance to see the other theme.
    </p>
    <div id="sheet"></div>
    <script src="./gallery.js"></script>
  </body>
</html>
